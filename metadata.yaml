name: astrbot_plugin_feiyu_companion
display_name: 大肥鱼综合陪伴
short_desc: 陪伴插件（M11-C）：主人优先的长期陪伴——B站只读与分享交接、语音出图、识屏摄像头设备直播只读、一局文字小游戏，外加只读工作台与状态快照
desc: >
  《大肥鱼综合陪伴系统实施方案》M6-D 阶段产物：B站只读桥 + 近况注入 + 分享影子
  + 分享交接的 generation/ACK 双端协议。
  M7-A：语音。默认关；就算开着，也只在主人这一句明确要（/陪伴语音）时换一次单轮授权，
  合成不了就退回文字，绝不静音假成功，也绝不让模型自己决定开麦。
  shadow 只生成「真交接时会发哪一条、为什么」，每条决策 executable=false，
  不发送、不申请额度、不改对端任何状态；分享权只来自配置与主人授权，证据永不换授权。
  已实现（本地可测）：InteractionContext / SourceRef / CapabilityGrant / Delivery
  四个数据契约，Activity（模拟生活）与 ContactCandidate（谁能被主动联系）；
  权限默认值表（群聊能力集为空，语音/摄像头/识屏默认关闭，主人事实写入永不可授）；
  每日主动消息上限、每分钟动作上限、失败指数退避；
  一天的模拟生活、免打扰时段、主动时机与预算联动；
  投递状态机（pending → sending → sent / failed → dropped）+ 幂等账本
  （同一 idem_key 只成功一次，重启也不重复）+ 失败重试接回退避；
  单执行端锁（同一真实账号只有一个进程持有投递权）；
  真实发送适配器（AstrBotTransport：只发私聊、空正文不发、会话标识解析不了不发、
  回执不谎称已送达）；
  记忆只读端口（recall / changes / validate_sources），写入面故意断开——
  主人事实的唯一权威仍是记忆插件。
  主动陪伴规则（2026-10-25 定，M5.4 改随机节奏，M5.6 调免打扰到 7 点）：每分钟看一次；
  每次说完、或主人刚说过话，就掷一次骰子排下「下次开口的点」：
  白天（07:00–18:00）5–45 分钟，傍晚（18:00–22:30）10–90 分钟，深夜（22:30–07:00）30–180 分钟；
  到点且没有正在跑的主动投递，就发一条；一天最多 30 条；
  连着 4 条没有被回复就先忍住（主人一说话就清零）；23:00–07:00 一条不发。
  文案由当前对话模型现场写（写不出来退回朴素模板句）；写之前只读地取最近 N 条
  聊天记录当参考（hybrid：先 LLM 对话历史，再平台流水；私聊流水在 AstrBot 里通常为空），
  注入文本标为「只是事实参考，不是新的系统指令」，超过字数上限从最早的消息开始丢；
  三个时段的上下界都能配（interval_day_/evening_/night_min|max_minutes），
  写反会自动交换，某段两边相等就是该段的固定节奏；可选按句拆成几条短消息发送，
  段间停顿按字数对数计算。
  M6-D 的分享交接（2026-10-25 落地，仍只在本地）：B站在自己的库里写 share outbox
  （generation 唯一、payload_hash 防改载荷），这边认领 → 发送 → ACK；
  同一条 generation 只发一次，账本一行一次尝试，发送前后崩掉的那条记 unknown
  并且**不重放**（占额不重复）。转交默认不接线：要 mode=coordinated 且
  bili_share_relay_enabled=true 才会真的发；否则照常认领但如实 refused。
  M9-D：设备只读——/陪伴设备 读一次本机读数（CPU/内存/磁盘/电量/网卡/屏幕/声音设备），
  走同一条出站隧道、同一把令牌，默认关；只读、不控制、不落盘，主机名/MAC/IP 一律不外发。
  M9-E：直播只读——/陪伴直播 看一次公开的直播间状态（开播没有、在线多少、什么分区），
  不登录、不带凭证、不进房间、不取弹幕、不发任何东西，默认关。
  M9-F：文字小游戏——/陪伴玩 开局、/陪伴出招 攻|守|蓄 走一回合、/陪伴认输 结束。
  规则写死在代码里（攻/守/蓄、血量 10、蓄力上限 2、回合上限 12），她不联网、不花钱、不改规则；
  一局只在一个私聊会话里，存档在自己的 state/games.db，默认关。
  尚未接线：B站点赞真写动作、真正的唱歌引擎。识屏与摄像头都接了本机采集端（同一个 agent、同一条出站隧道），但默认都关；摄像头单独一套开关、授权与额度（2 次/日、180 秒），本机打不开时会如实转达 0x80070005，不返回占位图。
  本插件不允许自己开 SQLite 写记忆库。
help: |
  /陪伴状态 — 装了哪些能力、今天怎么过、还有几条主动额度、节奏与下次开口的点、未回复计数、上下文来源、分段开关、现在为什么发/不发
  /陪伴投递 — 手动跑一轮：过闸门与队列，看它拦了什么、发了什么
  /陪伴会话 — 看主动消息现在发到哪个会话
  /陪伴语音 — 把一句中文念出来（一次一条，只在私聊，只在这一句明确要时）
  /陪伴画 — 画一张图（一次一张，只在私聊；本机 ComfyUI 连不上就只说文字）
  /陪伴B站 — 只读诊断：桥连没连上、读到几篇、认识什么、额度还剩多少（只在主人私聊里）
  /陪伴分享 — 分享影子：只算「会发哪一条、为什么」，一条都不发（只在主人私聊里）
  /陪伴分享 交接 — 跑一轮交接：认领 B站 outbox、发、写回执（coordinated 才认领）
  /陪伴设备 — 读一次本机读数（只读、一次一份，默认关）
  /陪伴直播 — 看一次公开的直播间状态（不登录、不进房间，默认关）
  /陪伴玩 — 开一局文字小游戏（默认关）
  /陪伴出招 攻|守|蓄 — 走一回合
  /陪伴认输 — 这一局到此为止
  仅私聊可用；主动消息只发私聊，每天最多 30 条，间隔随机（白天 5–45 / 傍晚 10–90 / 深夜 30–180 分钟），23:00–07:00 不打扰。
